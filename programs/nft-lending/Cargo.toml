[package]
name = "nft-lending"
version = "0.1.0"
description = "NFT-backed P2P lending with dual CLOB and liquidity rewards"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "nft_lending"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token", "associated_token", "metadata"] }
mpl-token-metadata = "4.1.2"

[dev-dependencies]
anchor-lang = "0.30.1"
