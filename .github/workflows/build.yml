name: Build & Deploy Solana Program

on:
  push:
    branches: [main, develop]
    paths:
      - "programs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Anchor.toml"
  pull_request:
    paths:
      - "programs/**"
      - "Cargo.toml"
  workflow_dispatch:

env:
  SOLANA_VERSION: "1.18.15"
  ANCHOR_VERSION: "0.30.1"

jobs:
  build:
    name: Build & Deploy Solana Program
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Need two Rust versions:
      #   1.79.0 → compile anchor-cli (time v0.3.29 breaks on Rust >= 1.80)
      #   stable → run anchor build / cargo build-sbf (edition2024 deps need >= 1.85)
      - name: Install Rust 1.79.0 (for anchor-cli)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.79.0"

      - name: Install Rust stable (for program build)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Cache Solana platform-tools
        uses: actions/cache@v4
        with:
          path: ~/.local/share/solana/install/active_release/bin/sdk/sbf/dependencies
          key: platform-tools-${{ env.SOLANA_VERSION }}

      - name: Install Anchor CLI (built with Rust 1.79)
        run: cargo +1.79.0 install --git https://github.com/coral-xyz/anchor --tag v${{ env.ANCHOR_VERSION }} anchor-cli --locked
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: true

      - name: Build program
        run: anchor build

      - name: Verify program size
        run: |
          SIZE=$(wc -c < target/deploy/nft_lending.so)
          echo "Program size: $SIZE bytes"
          if [ $SIZE -gt 1000000 ]; then
            echo "WARNING: Program is larger than 1MB"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nft-lending-program
          path: |
            target/deploy/nft_lending.so
            target/idl/nft_lending.json
          if-no-files-found: error

      # Deploy to devnet only on push to main (not PRs)
      - name: Deploy to devnet
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # Restore deployer keypair from secret
          echo "$DEPLOYER_KEYPAIR_B64" | base64 -d > /tmp/deployer.json
          solana config set --keypair /tmp/deployer.json --url devnet

          # Airdrop SOL if balance is low
          BALANCE=$(solana balance --url devnet | awk '{print $1}')
          if (( $(echo "$BALANCE < 1" | bc -l) )); then
            solana airdrop 2 --url devnet || true
            sleep 5
          fi

          # Deploy the program
          anchor deploy --provider.cluster devnet --provider.wallet /tmp/deployer.json

          # Shred the keypair from runner
          rm /tmp/deployer.json
        env:
          DEPLOYER_KEYPAIR_B64: ${{ secrets.DEPLOYER_KEYPAIR_B64 }}

  check-indexer:
    name: Check Indexer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            indexer/target
          key: ${{ runner.os }}-indexer-${{ hashFiles('indexer/Cargo.lock') }}

      - name: cargo check indexer
        run: cargo check
        working-directory: indexer
