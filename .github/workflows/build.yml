name: Build & Deploy Solana Program

on:
  push:
    branches: [main, develop]
    paths:
      - "programs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Anchor.toml"
  pull_request:
    paths:
      - "programs/**"
      - "Cargo.toml"
  workflow_dispatch:

env:
  # Use latest stable Solana (Agave 2.x) — bundles cargo 1.81+ which reads lock file v4.
  # anchor-cli 0.30.1 is still used to generate the IDL; cargo-build-sbf handles the
  # actual BPF compilation from the stable toolchain.
  SOLANA_VERSION: "stable"
  ANCHOR_VERSION: "0.30.1"

jobs:
  build:
    name: Build & Deploy Solana Program
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # anchor-cli 0.30.1 → time v0.3.29 → fails on Rust >= 1.80. Use 1.79 to compile it.
      - name: Install Rust 1.79.0 (for anchor-cli compile)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.79.0"

      # Rust stable needed for cargo-build-sbf (edition2024 deps) and lock file v4.
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Solana CLI (stable/latest)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Cache Solana platform-tools
        uses: actions/cache@v4
        with:
          path: ~/.local/share/solana/install/active_release/bin/sdk/sbf/dependencies
          key: platform-tools-agave-stable-${{ hashFiles('Cargo.lock') }}

      - name: Install Anchor CLI (compiled with Rust 1.79 to avoid time crate regression)
        run: cargo +1.79.0 install --git https://github.com/coral-xyz/anchor --tag v${{ env.ANCHOR_VERSION }} anchor-cli --locked
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: true

      # blake3 ≥1.8.0 sets `edition = "2024"` in its Cargo.toml, which Cargo < 1.85
      # (Agave stable bundles 1.84) cannot parse.  Downgrade in the working-copy
      # lock file using the system stable cargo before cargo-build-sbf runs.
      - name: Pin blake3 to 1.7.0 (edition2024 compat)
        run: cargo update -p blake3 --precise 1.7.0

      - name: Build program
        run: anchor build

      - name: Verify program size
        run: |
          SIZE=$(wc -c < target/deploy/nft_lending.so)
          echo "Program size: $SIZE bytes"
          if [ $SIZE -gt 1000000 ]; then
            echo "WARNING: Program is larger than 1MB"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nft-lending-program
          path: |
            target/deploy/nft_lending.so
            target/idl/nft_lending.json
          if-no-files-found: error

      # Deploy to devnet only on push to main (not PRs or workflow_dispatch)
      - name: Deploy to devnet
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "$DEPLOYER_KEYPAIR_B64" | base64 -d > /tmp/deployer.json
          solana config set --keypair /tmp/deployer.json --url devnet

          BALANCE=$(solana balance --url devnet | awk '{print $1}')
          if (( $(echo "$BALANCE < 1" | bc -l) )); then
            solana airdrop 2 --url devnet || true
            sleep 5
          fi

          anchor deploy --provider.cluster devnet --provider.wallet /tmp/deployer.json
          rm /tmp/deployer.json
        env:
          DEPLOYER_KEYPAIR_B64: ${{ secrets.DEPLOYER_KEYPAIR_B64 }}

  check-indexer:
    name: Check Indexer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            indexer/target
          key: ${{ runner.os }}-indexer-${{ hashFiles('indexer/Cargo.lock') }}

      - name: cargo check indexer
        run: cargo check
        working-directory: indexer
