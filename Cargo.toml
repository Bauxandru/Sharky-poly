[workspace]
# NOTE: indexer is a separate workspace (different Cargo.toml) because it uses
# yellowstone-grpc which pins solana-sdk 2.x, while the Solana program uses 1.18.
# Build the indexer from: cd indexer && cargo build --release
members = [
    "programs/*",
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "thin"
opt-level = 3
incremental = false
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
