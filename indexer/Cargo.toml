[workspace]
resolver = "2"

[package]
name = "indexer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "indexer"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# gRPC / Yellowstone (Helius/Triton geyser plugin stream)
# v12 has no Solana deps — pure protobuf/gRPC, eliminates zeroize conflict
yellowstone-grpc-client = "12.0"
yellowstone-grpc-proto = "12.0"
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
prost = "0.13"

# Borsh for Anchor event deserialization (same major version as Anchor 0.30)
borsh = { version = "1.5", features = ["derive"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
uuid = { version = "1", features = ["v4"] }

# Web server (REST + WebSocket)
axum = { version = "0.7", features = ["ws"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# WebSocket
tokio-tungstenite = "0.21"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Base58 + SHA-256 + Base64 for Anchor event/log parsing
bs58 = "0.5"
sha2 = "0.10"
base64 = "0.21"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config
dotenvy = "0.15"
anyhow = "1"

# Score calculation
rust_decimal = { version = "1", features = ["maths"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto = "thin"
